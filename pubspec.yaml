name: gaming_world
description: Gaming World - Top Up Game, Pulsa & Voucher Termurah
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.24.0
  firebase_auth: ^4.15.0
  cloud_firestore: ^4.13.0
  firebase_messaging: ^14.7.0
  http: ^1.1.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  image_picker: ^1.0.4
  webview_flutter: ^4.4.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_native_splash: ^2.3.10
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

# ═══════════════════════════════════════════════════════════════════════════
#  CONFIG: SPLASH SCREEN
# ═══════════════════════════════════════════════════════════════════════════
flutter_native_splash:
  color: "#7c3aed"
  color_dark: "#0f172a"
  image: "assets/icon/splash_logo.png"
  image_dark: "assets/icon/splash_logo.png"
  android_12:
    image: "assets/icon/splash_logo.png"
    color: "#7c3aed"
    color_dark: "#0f172a"
  android: true
  ios: false
  web: false
  fullscreen: true

# ═══════════════════════════════════════════════════════════════════════════
#  CONFIG: APP ICON
# ═══════════════════════════════════════════════════════════════════════════
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#7c3aed"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true
