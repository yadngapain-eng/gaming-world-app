name: gaming_world
description: Gaming World - Top Up Game, Pulsa & Voucher Termurah
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.24.0
  firebase_auth: ^4.15.0
  cloud_firestore: ^4.13.0
  firebase_messaging: ^14.7.0
  http: ^1.1.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  image_picker: ^1.0.4
  webview_flutter: ^4.4.2
  intl: ^0.19.0
  google_sign_in: ^6.1.6
  url_launcher: ^6.2.1
  confetti: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_native_splash: ^2.3.10

flutter:
  uses-material-design: true


flutter_native_splash:
  color: "#7c3aed"
  android: true
  ios: false
  web: false
  android_12:
    color: "#7c3aed"
