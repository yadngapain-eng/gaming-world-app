name: Notify Telegram

on:
  workflow_run:
    workflows: ["Build APK"]
    types: [completed]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Telegram
        run: |
          STATUS="${{ github.event.workflow_run.conclusion }}"
          RUN_ID="${{ github.event.workflow_run.id }}"
          REPO="${{ github.repository }}"
          
          if [ "$STATUS" = "success" ]; then
            MSG="✅ Build APK berhasil!%0A%0ARepo: $REPO%0ABuild: #$RUN_ID%0A%0ADownload: https://github.com/$REPO/actions/runs/$RUN_ID"
          else
            MSG="❌ Build APK gagal!%0A%0ARepo: $REPO%0ABuild: #$RUN_ID%0ALog: https://github.com/$REPO/actions/runs/$RUN_ID"
          fi
          
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage"             -d "chat_id=${{ secrets.CHAT_ID }}"             -d "text=$MSG"             -d "parse_mode=HTML"
