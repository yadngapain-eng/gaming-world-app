name: Build APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (contoh: 1.0.0)'
        required: false
        default: '1.0.0'
      changelog:
        description: 'Changelog'
        required: false
        default: 'Update'
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'
          cache: true


      - name: Get dependencies
        run: flutter pub get

      - name: Flutter Analyze (check errors)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Generate splash screen
        run: dart run flutter_native_splash:create || true

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons || true

      - name: Build APK (release)
        run: flutter build apk --release --split-per-abi

      - name: Rename APK
        run: |
          mkdir -p build/apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/apk/gaming-world-armv7.apk || true
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/apk/gaming-world-arm64.apk || true
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk build/apk/gaming-world-x86_64.apk || true
          ls -la build/apk/

      - name: Upload APK (arm64)
        uses: actions/upload-artifact@v4
        with:
          name: gaming-world-arm64
          path: build/apk/gaming-world-arm64.apk
          if-no-files-found: warn

      - name: Upload APK (armv7)
        uses: actions/upload-artifact@v4
        with:
          name: gaming-world-armv7
          path: build/apk/gaming-world-armv7.apk
          if-no-files-found: warn

      - name: Upload APK (universal)
        uses: actions/upload-artifact@v4
        with:
          name: gaming-world-universal
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn

      - name: Create Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.event.inputs.version }}-${{ github.run_number }}
          name: Release v${{ github.event.inputs.version }}
          body: |
            ${{ github.event.inputs.changelog }}

            Build: #${{ github.run_number }}
          files: |
            build/apk/gaming-world-arm64.apk
            build/apk/gaming-world-armv7.apk
            build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
