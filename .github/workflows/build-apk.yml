name: Build APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
        required: false
        default: '1.0.0'
      changelog:
        description: 'Changelog'
        required: false
        default: 'Update'
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'
          cache: true

      - name: Setup keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release-key.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release-key.jks
          EOF
          echo "=== Keystore setup ==="
          ls -la android/app/release-key.jks

      - name: Get dependencies
        run: flutter pub get

      - name: Flutter Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons || true

      - name: Build APK Universal
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mkdir -p build/apk
          cp build/app/outputs/flutter-apk/app-release.apk build/apk/gaming-world-universal.apk
          ls -la build/apk/

      - name: Upload APK Universal
        uses: actions/upload-artifact@v4
        with:
          name: gaming-world-universal
          path: build/apk/gaming-world-universal.apk
          if-no-files-found: error
